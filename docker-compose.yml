services:
  db:
    image: postgres:17-alpine
    container_name: mineral-atlas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: mineral_atlas
    ports:
      - "5433:5432"
    volumes:
      - mineral-atlas-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d mineral_atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mineral-atlas-pg:
